# Phase 9 confirmed-action policy and paired biological outcomes.
phase8_config: phase8.yaml

# Provisional synthetic assumptions for sensitivity analysis, not field guidance.
# cutoff_day is a zero-based day relative to the base sowing date.
interventions:
  water_deficit:
    response_delay_days: 1
    efficacy: 0.80
    cutoff_day: 90
    cost_per_ha: 35.0
  excess_water:
    response_delay_days: 2
    efficacy: 0.65
    cutoff_day: 90
    cost_per_ha: 60.0
  nutrient_deficit:
    response_delay_days: 2
    efficacy: 0.75
    cutoff_day: 75
    cost_per_ha: 55.0
  canopy_damage:
    response_delay_days: 1
    efficacy: 0.85
    cutoff_day: 95
    cost_per_ha: 45.0

output:
  directory: ../outputs/phase9
  action_events_filename: action_events.csv
  action_evaluation_filename: action_evaluation.csv
  scenario_outcomes_filename: scenario_outcomes.csv
