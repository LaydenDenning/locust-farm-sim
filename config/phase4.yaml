# Phase 4 synthetic zone observations. Values are not calibrated reflectance.
phase1_config: phase1.yaml
phase3_config: phase3.yaml
issues_file: ../data/phase4/issues.csv

schedule:
  start_day: 35
  # The modeled zones mature on campaign days 100-102.
  end_day: 98
  interval_days: 7
  # One deterministic weather-related missed mission for validation.
  grounded_days: [77]

observation:
  seed: 20220401
  random_noise_std: 0.015
  illumination_std: 0.04
  rgb_bias: 0.005
  nir_bias: 0.01
  spatial_mix_fraction: 0.05
  registration_mix_fraction: 0.08
  cloud_probability: 0.08
  missing_probability: 0.02
  cloud_signal_factor: 0.65
  lai_saturation: 1.5

output:
  directory: ../outputs/phase4
  observations_filename: observations.csv
  survey_summary_filename: survey_summary.csv
